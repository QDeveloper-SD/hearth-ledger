# Builds the desktop installers on Linux, Windows and macOS.
# - Push a tag like v1.2.0: installers are attached to that tag's GitHub Release.
# - Run manually (Actions tab -> Run workflow): installers are kept as build artifacts only.
name: Desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist yet
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Hearth Ledger ${TAG#v}" --generate-notes

  build:
    name: Build (${{ matrix.name }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-22.04,  backend: hearth-backend }
          - { name: Windows, os: windows-latest, backend: hearth-backend.exe }
          - { name: macOS,   os: macos-latest,  backend: hearth-backend }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install backend dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Backend tests
        run: python -m pytest backend/tests -q

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build the frontend
        run: bun run build

      - name: Freeze the backend (PyInstaller)
        run: python -m PyInstaller --noconfirm --distpath build/pyinstaller --workpath build/pyi-work hearth-backend.spec

      - name: Smoke-test the frozen backend
        env:
          HEARTH_PORT: "8791"
          HEARTH_DIST_DIR: ${{ github.workspace }}/dist
        run: |
          export HEARTH_DATA_DIR="$RUNNER_TEMP/hearth-data"
          "build/pyinstaller/hearth-backend/${{ matrix.backend }}" > backend.log 2>&1 &
          pid=$!
          ok=""
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8791/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then echo "backend did not start"; cat backend.log; exit 1; fi
          curl -fsS http://127.0.0.1:8791/api/auth/status | grep -q '"needs_setup":true'
          curl -fsS -o /dev/null http://127.0.0.1:8791/
          kill $pid || true

      - name: Package the installer (electron-builder)
        run: npx electron-builder --publish never

      - name: Check the macOS app signature (ad-hoc)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/*.app
          codesign -dv release/mac-arm64/*.app 2>&1 | grep -i signature

      - name: List installers
        run: ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
            release/*.dmg

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.deb release/*.AppImage release/*.exe release/*.dmg)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
